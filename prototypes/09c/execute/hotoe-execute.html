<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Hotoe Prototype 09C</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    color: white;
    font-family: "Cascadia Mono", Consolas, monospace;
}

#app {
    position: fixed;
    left: 80px;
    top: 80px;
    width: 420px;
    padding: 22px;
    background: rgba(13, 18, 24, .94);
    border: 1px solid rgba(134, 181, 219, .45);
}

h1 {
    margin: 0 0 16px;
    font-size: 22px;
}

button {
    width: 160px;
    height: 42px;
    border: 0;
    color: white;
    background: #224357;
    cursor: pointer;
}

button:hover {
    background: #2f607d;
}

#message {
    margin-top: 18px;
    min-height: 42px;
    padding: 12px;
    background: rgba(0, 0, 0, .28);
    color: #b8d9f0;
}
</style>
</head>

<body>
<main id="app" SIR>
    <h1>Prototype 09C IPC</h1>
    <button SIR onclick="push('Hello')">push("Hello")</button>
    <div id="message">Waiting for busMessage.</div>
</main>

<script src="../../../runtime/js/fx.js"></script>
<script src="app.js"></script>
</body>

</html>
