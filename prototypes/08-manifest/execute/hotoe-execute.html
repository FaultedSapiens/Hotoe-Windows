<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Hotoe P7B RPC Monitor</title>

<style>

*{

    box-sizing:border-box;

}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    background:#0c1117;

    color:white;

    font-family:

        "JetBrains Mono",
        "Cascadia Mono",
        Consolas,
        monospace;

}

#app{

    width:100%;
    height:100%;

    display:grid;

    grid-template-rows:

        72px
        120px
        90px
        120px
        1fr;

    gap:22px;

    padding:28px;

    background-image:

        linear-gradient(

            rgba(255,255,255,.035) 1px,

            transparent 1px

        ),

        linear-gradient(

            90deg,

            rgba(255,255,255,.035) 1px,

            transparent 1px

        );

    background-size:

        32px 32px;

}

header{

    display:flex;

    justify-content:space-between;

    align-items:center;

}

#title{

    font-size:32px;

    font-weight:700;

    letter-spacing:2px;

}

#title span{

    color:#69b8ff;

}

#status{

    display:flex;

    align-items:center;

    gap:12px;

    font-size:15px;

}

.dot{

    width:12px;
    height:12px;

    border-radius:50%;

    background:#48ff93;

    box-shadow:

        0 0 18px #48ff93;

}

#pipeline{

    display:grid;

    grid-template-columns:

        220px
        1fr
        220px
        1fr
        220px;

    gap:18px;

    align-items:center;

}

.node{

    height:82px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#121b24;

    border:1px solid #314253;

    border-radius:12px;

    font-size:20px;

    transition:.2s;

}

.node.active{

    border-color:#69b8ff;

    box-shadow:

        0 0 18px rgba(105,184,255,.45);

}

.bus{

    position:relative;

    height:4px;

    background:#334655;

    border-radius:20px;

    overflow:hidden;

}

.packet{

    position:absolute;

    left:-16px;
    top:-5px;

    width:14px;
    height:14px;

    border-radius:50%;

    background:#66d7ff;

    box-shadow:

        0 0 20px #66d7ff;

}

#controls{

    display:flex;

    justify-content:center;

    gap:20px;

}

button{

    width:170px;

    height:52px;

    background:#213343;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

    transition:.18s;

}

button:hover{

    background:#30495d;

    transform:translateY(-2px);

}

#stats{

    display:grid;

    grid-template-columns:

        repeat(4,1fr);

    gap:20px;

}

.card{

    background:#111923;

    border:1px solid #324454;

    border-radius:12px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}

.card label{

    color:#8096ad;

    margin-bottom:8px;

}

.card span{

    font-size:34px;

    font-weight:700;

}

#console{

    overflow:auto;

    background:#10161d;

    border:1px solid #324454;

    border-radius:12px;

}

#rpcTable{

    width:100%;

    border-collapse:collapse;

    font-size:13px;

}

thead{

    position:sticky;

    top:0;

    background:#17212b;

}

th{

    text-align:left;

    padding:14px;

    color:#8aa5bf;

    border-bottom:1px solid #324454;

}

td{

    padding:12px 14px;

    border-bottom:1px solid rgba(255,255,255,.05);

}

tbody tr:hover{

    background:#18222d;

}

.tx{

    color:#5db7ff;

}

.rx{

    color:#57ff8f;

}

.err{

    color:#ff6d6d;

}

#log{

    margin:0;

    width:100%;
    height:100%;

    overflow:auto;

    padding:18px;

    white-space:pre-wrap;

}

</style>

</head>

<body>

<div id="app">

<header>

<div id="title">

HOTOE

<span>

RPC MONITOR

</span>

</div>

<div id="status">

<div class="dot"></div>

CONNECTED

</div>

</header>

<section id="pipeline">

<div
class="node"
id="browserNode">

Browser

</div>

<div class="bus">

<div
class="packet"
id="packet1">

</div>

</div>

<div
class="node"
id="nativeNode">

Native

</div>

<div class="bus">

<div
class="packet"
id="packet2">

</div>

</div>

<div
class="node"
id="dispatcherNode">

Dispatcher

</div>

</section>

<section id="controls">

<button onclick="sendPing()">

Ping

</button>

<button onclick="sendEcho()">

Echo

</button>

<button onclick="sendUnknown()">

Unknown

</button>

<button onclick="location.reload()">

Reload

</button>

</section>

<section id="stats">

<div class="card">

<label>

Requests

</label>

<span id="reqCount">

0

</span>

</div>

<div class="card">

<label>

Responses

</label>

<span id="resCount">

0

</span>

</div>

<div class="card">

<label>

Pending

</label>

<span id="pendingCount">

0

</span>

</div>

<div class="card">

<label>

Errors

</label>

<span id="errCount">

0

</span>

</div>

</section>

<section id="console">

<table id="rpcTable">

<thead>

<tr>

<th>ID</th>
<th>Direction</th>
<th>Method</th>
<th>Status</th>

</tr>

</thead>

<tbody id="rpcBody">

</tbody>

</table>

</section>

</div>

<script src="../../../runtime/js/fx.js"></script>
<script src="app.js"></script>

</body>

</html>
