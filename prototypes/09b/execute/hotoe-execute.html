<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Hotoe Prototype 09B</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    color: white;
    font-family: "Cascadia Mono", Consolas, monospace;
}

#app {
    position: fixed;
    left: 80px;
    top: 80px;
    width: 520px;
    padding: 24px;
    background: rgba(12, 17, 23, .94);
    border: 1px solid rgba(134, 181, 219, .45);
}

h1 {
    margin: 0 0 18px;
    font-size: 24px;
    font-weight: 700;
}

#focusState {
    margin-bottom: 18px;
    color: #8ca6bb;
}

#controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    min-width: 140px;
    height: 44px;
    border: 0;
    color: white;
    background: #224357;
    cursor: pointer;
}

button:hover {
    background: #2f607d;
}

#log {
    margin-top: 18px;
    min-height: 84px;
    padding: 12px;
    background: rgba(0, 0, 0, .28);
    color: #b8d9f0;
    white-space: pre-wrap;
}
</style>
</head>

<body>
<main id="app" SIR>
    <h1>Prototype 09B</h1>
    <div id="focusState">focusEvent: false</div>

    <section id="controls">
        <button SIR onclick="SIRs()">SIRs()</button>
        <button SIR onclick="fx.ping().then(log)">Ping</button>
        <button SIR onclick="CLOSE()">CLOSE()</button>
    </section>

    <pre id="log">Fluent-X Basics loaded.</pre>
</main>

<script src="../../../runtime/js/fx.js"></script>
<script src="app.js"></script>
</body>

</html>
